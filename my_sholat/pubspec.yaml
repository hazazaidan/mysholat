name: my_sholat
description: Aplikasi pengingat waktu sholat berbasis lokasi untuk Indonesia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  http: ^1.2.1
  connectivity_plus: ^6.0.5
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.2
  lottie: ^3.1.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  cupertino_icons: ^1.0.8
  flutter_compass: ^0.8.0
  sensors_plus: ^6.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/